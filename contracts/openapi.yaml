  /accommodation-access-requests:
    post:
      summary: Pedir acesso para a própria hospedagem
      description: >
        Canal público e nominal, ao contrário do autocadastro do visitante
        (ADR-040): sem nome da acomodação não há o que aprovar, e sem e-mail não
        há a quem devolver o acesso depois. A resposta devolve somente id e
        created_at, e nunca ecoa o que foi enviado, porque a rota é aberta e o
        eco transformaria a criação em consulta de dado de contato alheio. Um
        pedido pendente por e-mail: o reenvio colide e responde 409.
      tags: [accommodations]
      operationId: createAccommodationAccessRequest
      x-cumuru-feature: self-service
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccommodationAccessRequest"
      responses:
        "201":
          description: Pedido registrado ou reproduzido por replay exato.
          headers:
