      description: >
        Canal aberto e sem operador. Coleta somente dados generalizados: nome,
        documento, e-mail e telefone são rejeitados (ADR-040). role='minor' é
        recusado com 422, porque não há como verificar responsável num
        formulário anônimo. expected_guest_count não vem no corpo: é o tamanho
        de visitors, o que remove qualquer divergência entre declarado e
        submetido. A estadia nasce pendente de aprovação e não alcança presença
        nem publicação enquanto não for aprovada.
