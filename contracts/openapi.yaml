        role:
          type: string
          enum: [responsible, companion, minor]
        age_band:
          type: string
          enum:
            - "0_5"
            - "6_11"
            - "12_17"
            - "18_24"
            - "25_34"
            - "35_44"
            - "45_59"
            - "60_plus"
