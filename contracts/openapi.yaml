openapi: 3.1.0
info:
  title: API do Observatório Turístico de Cumuruxatiba
  version: 0.7.0
  license:
    name: Licença a definir pelo Município de Prado
    identifier: LicenseRef-Proprietary
  description: >
    Contrato da fundação, estadias, questionários e métricas públicas. A
    extensão x-cumuru-feature informa a funcionalidade proprietária de cada
    operação — platform, core, questionnaire, analytics ou self-service — e o
    valor deferred marca a operação ainda não implementada. Tudo roda em modo
    PROTOTYPE_ONLY e somente com fixtures fictícias e generalizadas.
servers:
  - url: https://turismo.prado.ba.gov.br/api/v1
tags:
  - name: auth
    description: >
      Autenticação local por e-mail e senha para operadores sem CNPJ, Cadastur
      ou credencial federal. Emite sessão opaca e não substitui o IdP municipal
      quando este existir.
  - name: platform
    description: Estado operacional e metadados técnicos da fundação.
  - name: public
    description: Indicadores agregados e metodologia pública.
  - name: analytics
    description: Qualidade agregada interna, sem microdados.
  - name: accommodations
    description: >
      Acomodações do Observatório local e seus vínculos operacionais. Categoria,
      Cadastur e estado ativo não comprovam regularidade ou elegibilidade FNRH.
  - name: stays
    description: Gestão autenticada de estadias.
  - name: invites
    description: Autopreenchimento limitado por convite.
  - name: questionnaires
    description: Questionários publicados e suas respostas.
  - name: privacy
    description: Exercício dos direitos do titular.
security:
  - oidc: []
paths:
  /auth/login:
    post:
      summary: Abrir sessão local por e-mail e senha
      description: >
        Autentica um operador local sem exigir CNPJ, Cadastur ou credencial
        federal. Responde igual para e-mail inexistente e senha incorreta, e
        aplica bloqueio temporário por tentativas repetidas.
      tags: [auth]
      operationId: login
      x-cumuru-feature: core
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/ProblemWithRetry"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /auth/logout:
    post:
      summary: Encerrar a sessão local corrente
      description: >
        Revoga a sessão apresentada. É idempotente: um token já revogado ou
        desconhecido também responde 204.
      tags: [auth]
      operationId: logout
      x-cumuru-feature: core
      security:
        - session: []
      responses:
        "204":
          description: Sessão revogada ou já inexistente.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /auth/password:
    post:
      summary: Trocar a senha da sessão corrente
      description: >
        Substitui a senha da conta autenticada e revoga todas as sessões
        abertas com a senha anterior, inclusive a que fez a chamada. É o único
        caminho disponível para uma sessão marcada com must_change_password;
        depois da troca o cliente autentica novamente.
      tags: [auth]
      operationId: rotatePassword
      x-cumuru-feature: core
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRotationRequest"
      responses:
        "204":
          description: Senha trocada e sessões anteriores revogadas.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/ProblemWithRetry"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /auth/session:
    get:
      summary: Consultar a sessão local corrente
      tags: [auth]
      operationId: getSession
      x-cumuru-feature: core
      security:
        - session: []
      responses:
        "200":
          description: Sessão válida.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /platform/health:
    get:
      summary: Consultar liveness do processo
      tags: [platform]
      security: []
      operationId: getPlatformHealth
      x-cumuru-feature: platform
      responses:
        "200":
          description: Processo apto a responder HTTP.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /platform/readiness:
    get:
      summary: Consultar readiness do PostgreSQL
      tags: [platform]
      security: []
      operationId: getPlatformReadiness
      x-cumuru-feature: platform
      responses:
        "200":
          description: Dependências necessárias estão prontas.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /platform/build:
    get:
      summary: Consultar metadados técnicos do build
      tags: [platform]
      operationId: getPlatformBuild
      x-cumuru-feature: platform
      security:
        - oidc: ["platform:read"]
      responses:
        "200":
          description: Metadados técnicos permitidos do build.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /public/accommodations:
    get:
      summary: Listar hospedagens publicadas
      description: >
        Lista aberta de hospedagens, para quem procura onde ficar. Nominal de
        propósito e por isso fora de analytics: publica nome, categoria,
        localidade, capacidade, telefone e site de quem pediu para ser
        encontrado, e nada além disso. Só aparece a hospedagem ativa que
        consentiu com a publicação; retirado o consentimento, a linha sai da
        lista na mesma transação. Sem cursor e sem seletor: o documento é único
        e cacheável por inteiro, e filtrar é trabalho de quem lê.
      tags: [public]
      security: []
      operationId: listPublicAccommodations
      x-cumuru-feature: core
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Lista corrente de hospedagens publicadas.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/PublicCache"
            ETag:
              $ref: "#/components/headers/PublicEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAccommodationDirectory"
        "304":
          $ref: "#/components/responses/PublicNotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /public/summary:
    get:
      summary: Consultar resumo público
      tags: [public]
      security: []
      operationId: getPublicSummary
      x-cumuru-feature: analytics
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Resumo da release corrente, já agregado e protegido.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/PublicCache"
            ETag:
              $ref: "#/components/headers/PublicEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSummary"
        "304":
          $ref: "#/components/responses/PublicNotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /public/presence:
    get:
      summary: Consultar presença observada e prevista
      tags: [public]
      security: []
      operationId: getPublicPresence
      x-cumuru-feature: analytics
      parameters:
        - $ref: "#/components/parameters/PresenceWindow"
        - $ref: "#/components/parameters/PresenceMonth"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Série protegida da release corrente.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/PublicCache"
            ETag:
              $ref: "#/components/headers/PublicEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPresence"
        "304":
          $ref: "#/components/responses/PublicNotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /public/preferences:
    get:
      summary: Consultar preferências agregadas
      tags: [public]
      security: []
      operationId: getPublicPreferences
      x-cumuru-feature: analytics
      parameters:
        - $ref: "#/components/parameters/PreferencePeriod"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Preferências estruturadas, protegidas e group-level.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/PublicCache"
            ETag:
              $ref: "#/components/headers/PublicEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPreferences"
        "304":
          $ref: "#/components/responses/PublicNotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /public/methodology:
    get:
      summary: Consultar metodologia pública versionada
      tags: [public]
      security: []
      operationId: getPublicMethodology
      x-cumuru-feature: analytics
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Metodologia estruturada da release corrente.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/PublicCache"
            ETag:
              $ref: "#/components/headers/PublicEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMethodology"
        "304":
          $ref: "#/components/responses/PublicNotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /analytics/quality:
    get:
      summary: Consultar qualidade agregada interna
      tags: [analytics]
      operationId: getAnalyticsQuality
      x-cumuru-feature: analytics
      security:
        - oidc: ["analytics:read:internal"]
      parameters:
        - $ref: "#/components/parameters/QualityWindow"
      responses:
        "200":
          description: Snapshot interno agregado e sem IDs.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualitySnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /accommodations:
    get:
      summary: Listar acomodações acessíveis
      tags: [accommodations]
      operationId: listAccommodations
      x-cumuru-feature: core
      security:
        - oidc: ["stays:read:own"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Acomodações vinculadas ao principal autenticado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
    post:
      summary: Iniciar participação local de uma acomodação
      description: >
        Onboarding voluntário restrito ao protótipo local/teste. Aceita tanto a
        sessão local de e-mail e senha da ADR-037 quanto o principal federado, e
        cria organização mínima, acomodação ativa e primeira membership manager
        atomicamente. Não recebe documento, Cadastur, identidade de tenant ou
        qualquer configuração FNRH.
      tags: [accommodations]
      operationId: createAccommodation
      x-cumuru-feature: core
      security:
        - session: ["accommodations:onboard"]
        - oidc: ["accommodations:onboard"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccommodationRequest"
      responses:
        "201":
          description: Participação local criada ou reproduzida por replay exato.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/EntityTag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/ProblemWithRetry"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /accommodations/{accommodation_id}:
    get:
      summary: Consultar acomodação acessível
      tags: [accommodations]
      operationId: getAccommodation
      x-cumuru-feature: core
      security:
        - oidc: ["stays:read:own"]
      parameters:
        - $ref: "#/components/parameters/AccommodationId"
      responses:
        "200":
          description: Acomodação vinculada ao principal autenticado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
    patch:
      summary: Alterar campos operacionais da acomodação
      tags: [accommodations]
      operationId: updateAccommodation
      x-cumuru-feature: core
      security:
        - oidc: ["accommodations:manage"]
      parameters:
        - $ref: "#/components/parameters/AccommodationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateAccommodationRequest"
      responses:
        "200":
          description: Acomodação alterada.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /accommodations/{accommodation_id}/memberships:
    get:
      summary: Listar memberships da acomodação
      tags: [accommodations]
      operationId: listAccommodationMemberships
      x-cumuru-feature: core
      security:
        - oidc: ["accommodations:manage"]
      parameters:
        - $ref: "#/components/parameters/AccommodationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Memberships visíveis ao manager da acomodação.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
    post:
      summary: Criar membership na acomodação
      tags: [accommodations]
      operationId: createAccommodationMembership
      x-cumuru-feature: core
      security:
        - oidc: ["accommodations:manage"]
      parameters:
        - $ref: "#/components/parameters/AccommodationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
      responses:
        "201":
          description: Membership criada sem reproduzir o principal alvo.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/EntityTag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/ProblemWithRetry"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /accommodations/{accommodation_id}/memberships/{membership_id}:
    patch:
      summary: Alterar papel ou atividade de uma membership
      tags: [accommodations]
      operationId: updateAccommodationMembership
      x-cumuru-feature: core
      security:
        - oidc: ["accommodations:manage"]
      parameters:
        - $ref: "#/components/parameters/AccommodationId"
        - $ref: "#/components/parameters/MembershipId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        "200":
          description: Membership alterada.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/InternalServerProblem"
  /stays:
    post:
      summary: Criar estadia
      tags: [stays]
      operationId: createStay
      x-cumuru-feature: core
      security:
        - oidc: ["stays:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStayRequest"
      responses:
        "201":
          description: Estadia criada.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/EntityTag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
