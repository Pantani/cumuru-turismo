          minLength: 3
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 120
    AccommodationActivationCreated:
      type: object
      required: [activation_id, account_id, url, expires_at, version]
      additionalProperties: false
      properties:
        activation_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: >
            Token no fragmento. Só aparece nesta criação e no replay
            idempotente exato.
        expires_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    AccommodationActivationContext:
      type: object
      required: [accommodation_name, display_name, expires_at, password_policy]
      additionalProperties: false
      properties:
        accommodation_name:
          type: string
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
        password_policy:
          type: object
          required: [min_length, max_length]
          additionalProperties: false
          properties:
            min_length:
              type: integer
              const: 12
            max_length:
              type: integer
              const: 256
    ActivateAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256
    CreateAccommodationInviteRequest:
      type: object
      required: [privacy_notice_version]
      additionalProperties: false
      properties:
        privacy_notice_version:
          type: string
          minLength: 1
          maxLength: 100
        max_uses:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: >
            Ausente ou null significa uso ilimitado. Quando presente, o
            invariante use_count <= max_uses continua valendo.
    AccommodationInviteCreated:
      type: object
      required: [invite_id, url, expires_at, max_uses, use_count]
      additionalProperties: false
      properties:
        invite_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Token no fragmento (/i#token), nunca no caminho.
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: [integer, "null"]
          minimum: 1
        use_count:
          type: integer
          minimum: 0
    AccommodationInviteStatus:
      type: object
      required: [invite_id, expires_at, max_uses, use_count, revoked_at]
      additionalProperties: false
      properties:
        invite_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: [integer, "null"]
          minimum: 1
        use_count:
          type: integer
          minimum: 0
        revoked_at:
          type: [string, "null"]
          format: date-time
    ProofOfWorkChallenge:
      type: object
      required: [algorithm, challenge, difficulty_bits, expires_at]
      additionalProperties: false
      properties:
        algorithm:
          type: string
          const: sha256-leading-zero-bits
        challenge:
          type: string
          minLength: 32
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
          description: >
            Opaco e autenticado por MAC. Carrega dentro de si o nonce, o prazo,
            a dificuldade e o vínculo com o cartaz, de modo que o cliente não
            possa rebaixar a dificuldade nem gastar o desafio noutra acomodação.
        difficulty_bits:
          type: integer
          minimum: 1
          maximum: 32
          description: >
            Derivada do contador do balde de rate limit: a primeira submissão de
            uma rede é barata e a décima é cara.
        expires_at:
          type: string
          format: date-time
    AccommodationInviteContext:
      type: object
      required:
        - accommodation_name
        - privacy_notice_version
        - proof_of_work
      additionalProperties: false
      properties:
