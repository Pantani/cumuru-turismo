          type: integer
          minimum: 0
          multipleOf: 10
        central:
          type: integer
          minimum: 0
          multipleOf: 10
        upper:
          type: integer
          minimum: 0
          multipleOf: 10
    ProtectedObservedPoint:
      type: object
      required: [date, kind, status]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          const: observed
        status:
          type: string
          enum: [protected, unavailable]
    ObservedPresencePoint:
      oneOf:
        - $ref: "#/components/schemas/PublishedObservedPoint"
        - $ref: "#/components/schemas/ProtectedObservedPoint"
    ProtectedForecastPoint:
      type: object
      required: [date, kind, status]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          const: forecast
        status:
          type: string
          enum: [protected, unavailable]
    ForecastPresencePoint:
      oneOf:
        - $ref: "#/components/schemas/PublishedForecastPoint"
        - $ref: "#/components/schemas/ProtectedForecastPoint"
    ObservedPublicPresence:
      type: object
      required: [metadata, window, series]
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/PublicMetadata"
        window:
          type: string
          enum:
            - recent_30_days
            - recent_90_days
            - recent_365_days
            - recent_730_days
            - month
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        series:
          type: array
          maxItems: 730
          items:
            $ref: "#/components/schemas/ObservedPresencePoint"
    ForecastPublicPresence:
      type: object
      required: [metadata, window, series]
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/PublicMetadata"
        window:
          type: string
          const: next_30_days
        series:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ForecastPresencePoint"
    PublicPresence:
      oneOf:
        - $ref: "#/components/schemas/ObservedPublicPresence"
        - $ref: "#/components/schemas/ForecastPublicPresence"
    ForecastPeakPublished:
      type: object
      required: [date, kind, status, lower, central, upper]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          const: forecast
        status:
          type: string
          const: published
        lower:
          type: integer
          minimum: 0
          multipleOf: 10
        central:
          type: integer
          minimum: 0
          multipleOf: 10
        upper:
          type: integer
          minimum: 0
          multipleOf: 10
    ForecastPeakProtected:
      type: object
      required: [kind, status]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: forecast
        status:
          type: string
          enum: [protected, unavailable]
    ForecastPeak:
      oneOf:
        - $ref: "#/components/schemas/ForecastPeakPublished"
        - $ref: "#/components/schemas/ForecastPeakProtected"
    PublicSummary:
      type: object
      required: [metadata, presence_today, forecast_peak_next_30_days]
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/PublicMetadata"
        presence_today:
          $ref: "#/components/schemas/ObservedPresencePoint"
        forecast_peak_next_30_days:
          $ref: "#/components/schemas/ForecastPeak"
    PublishedPreferenceCategory:
      type: object
      required: [category_code, status, share_percent]
      additionalProperties: false
      properties:
        category_code:
          type: string
          enum: [first_visit, returning]
        status:
          type: string
          const: published
        share_percent:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
    ProtectedPreferenceCategory:
      type: object
      required: [category_code, status]
      additionalProperties: false
      properties:
        category_code:
          type: string
          enum: [first_visit, returning]
        status:
          type: string
          enum: [protected, unavailable]
    PreferenceCategory:
      oneOf:
        - $ref: "#/components/schemas/PublishedPreferenceCategory"
        - $ref: "#/components/schemas/ProtectedPreferenceCategory"
    PublicPreferenceMetric:
      type: object
      required: [metric_code, dimension_code, categories]
      additionalProperties: false
      properties:
        metric_code:
          type: string
          const: first_visit_share
        dimension_code:
          type: string
          const: visit_profile
        categories:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/PreferenceCategory"
    PublicPreferences:
      type: object
      required: [metadata, period, metrics]
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/PublicMetadata"
        period:
          type: string
          const: last_complete_month
        metrics:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/PublicPreferenceMetric"
    PublicMethodology:
      type: object
      required:
        - metadata
        - presence_interval
        - time_zone
        - observed_definition_code
        - forecast_definition_code
        - forecast_bounds_percent
        - forecast_fallback_bounds_percent
        - primary_threshold
        - minimum_reporting_accommodations
        - complementary_suppression
        - rounding_base
        - rounding_mode
        - presence_history_days
        - allowed_presence_windows
        - allowed_preference_periods
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/PublicMetadata"
        presence_interval:
          type: string
          const: "[arrival,departure)"
        time_zone:
          type: string
          const: America/Bahia
        observed_definition_code:
          type: string
          const: checked_presence_through_as_of
        forecast_definition_code:
          type: string
          const: explainable-baseline-v1
        forecast_bounds_percent:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: integer
              const: 85
            - type: integer
              const: 115
        forecast_fallback_bounds_percent:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: integer
              const: 70
            - type: integer
              const: 130
        primary_threshold:
          type: integer
          const: 10
        minimum_reporting_accommodations:
          type: integer
          const: 3
        complementary_suppression:
          type: boolean
          const: true
        rounding_base:
          type: integer
          const: 10
        rounding_mode:
          type: string
          const: stable-half-up
        presence_history_days:
          type: integer
          const: 730
          description: |
            Dias civis de histórico observado que a release corrente publica,
            contados a partir do dia de referência da publicação.
        allowed_presence_windows:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
            enum:
              - recent_30_days
              - recent_90_days
              - recent_365_days
              - recent_730_days
              - next_30_days
              - month
        allowed_preference_periods:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: last_complete_month
    AvailableQualityCount:
      type: object
      required: [status, value]
      additionalProperties: false
      properties:
        status:
          type: string
          const: available
        value:
          type: integer
          minimum: 0
    UnavailableQualityCount:
      type: object
      required: [status, reason_code]
      additionalProperties: false
      properties:
        status:
          type: string
          const: not_available
        reason_code:
          type: string
          enum: [not_implemented, pseudonym_not_approved, insufficient_source]
    QualityCount:
      oneOf:
        - $ref: "#/components/schemas/AvailableQualityCount"
        - $ref: "#/components/schemas/UnavailableQualityCount"
    AvailableQualityCoverage:
      type: object
      required: [category_code, status, ratio]
      additionalProperties: false
      properties:
        category_code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        status:
          type: string
          const: available
        ratio:
          type: number
          minimum: 0
          maximum: 1
    UnavailableQualityCoverage:
      type: object
      required: [category_code, status]
      additionalProperties: false
      properties:
        category_code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        status:
          type: string
          const: not_available
    QualityCoverage:
      oneOf:
        - $ref: "#/components/schemas/AvailableQualityCoverage"
        - $ref: "#/components/schemas/UnavailableQualityCoverage"
    QualitySnapshot:
      type: object
      required:
        - window
        - updated_at
        - incomplete_stays
        - overdue_planned_departures
        - silent_accommodations
        - aggregation_failures
        - suspected_duplicates
        - fnrh_failures
        - coverage_by_category
      additionalProperties: false
      properties:
        window:
          type: string
          const: last_30_days
        updated_at:
          type: string
          format: date-time
        incomplete_stays:
          $ref: "#/components/schemas/QualityCount"
        overdue_planned_departures:
          $ref: "#/components/schemas/QualityCount"
        silent_accommodations:
          $ref: "#/components/schemas/QualityCount"
        aggregation_failures:
          $ref: "#/components/schemas/QualityCount"
        suspected_duplicates:
          $ref: "#/components/schemas/QualityCount"
        fnrh_failures:
          $ref: "#/components/schemas/QualityCount"
        coverage_by_category:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/QualityCoverage"
