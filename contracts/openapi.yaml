        "500":
          $ref: "#/components/responses/InternalServerProblem"
    get:
      summary: Listar pedidos de convite da hospedagem
      description: >
        Fila da administração. O item traz o contato porque é ele que a tela usa
        para decidir e, depois de aprovar, para emitir o acesso — a emissão
        continua sendo o passo separado de POST
        /accommodations/{accommodation_id}/activation. Em rejected e expired o
        contato vem nulo, porque já foi eliminado (ADR-042); expires_at diz
        quanto resta ao pendente antes de o worker o expirar.
