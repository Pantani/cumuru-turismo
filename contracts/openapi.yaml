          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConsentRequirementDefinition"
        proof_of_work:
          $ref: "#/components/schemas/ProofOfWorkChallenge"
    SelfServiceVisitorInput:
      description: >
        Visitante do canal aberto. Somente dados generalizados; role='minor' é
        recusado porque não há como verificar responsável num formulário
        anônimo e não autenticado (ADR-040).
      allOf:
        - $ref: "#/components/schemas/VisitorInput"
        - type: object
          properties:
            role:
              type: string
              enum: [responsible, companion]
