        proof_of_work:
          type: object
          required: [challenge, solution]
          additionalProperties: false
          properties:
            challenge:
              type: string
              minLength: 32
              maxLength: 256
              pattern: "^[A-Za-z0-9_-]+$"
            solution:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
