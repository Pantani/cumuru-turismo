                  request_id:
                    type: string
                    format: uuid
                  status:
                    const: pending_verification
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
    session:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Token opaco emitido por POST /auth/login. O servidor guarda somente o
        SHA-256 do token e o principal derivado tem os mesmos escopos de um
        principal OIDC.
  parameters:
    PresenceWindow:
      name: window
      in: query
      required: true
      description: |
        Janela do documento publicado. As janelas `recent_*` recortam o
        histórico diário observado; `month` recorta um mês civil e exige o
        parâmetro `month`. `next_30_days` é a única janela de previsão.
      schema:
        type: string
        enum:
          - recent_30_days
          - recent_90_days
          - recent_365_days
          - recent_730_days
          - next_30_days
          - month
    PresenceMonth:
      name: month
      in: query
      required: false
      description: |
        Mês civil consultado, obrigatório quando `window=month` e recusado em
        qualquer outra janela. Fora do histórico publicado o documento não
        existe e a resposta é 503.
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    PreferencePeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
        const: last_complete_month
    QualityWindow:
      name: window
      in: query
      required: true
      schema:
        type: string
        const: last_30_days
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"sha256-[0-9a-f]{64}"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 16
        maxLength: 512
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AccommodationId:
      name: accommodation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccommodationAccessRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccommodationAccessRequestState:
      name: approval_state
      in: query
      description: Recorte da fila; ausente devolve todos os estados.
      schema:
        $ref: "#/components/schemas/AccommodationAccessRequestApprovalState"
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StayId:
      name: stay_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    QuestionnaireId:
      name: questionnaire_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionnaireVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionnaireStableKey:
      name: stable_key
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: "^[a-z][a-z0-9_]*$"
    InviteTokenHeader:
      name: X-Cumuru-Invite-Token
      in: header
      required: true
      description: >
        Token do cartaz, lido pelo cliente do fragmento da URL (/i#token). O
        fragmento nunca é enviado ao servidor, então o token não alcança linha
        de requisição, access log, WAF nem CDN. O cabeçalho customizado força
        preflight CORS, a mesma propriedade que Idempotency-Key já explora para
        impedir POST de formulário simples (ADR-039).
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    ActivationTokenHeader:
      name: X-Cumuru-Activation-Token
      in: header
      required: true
      description: >
        Capability de ativação, lida do fragmento da URL. Cabeçalho distinto do
        convite de propósito: purposes separados são domínios criptográficos
        separados, e o Verify confere o purpose (ADR-039, ADR-041).
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    SurveyCapability:
      name: Survey-Capability
      in: header
      required: true
      description: Capability opaca e purpose-bound exclusiva da submissão.
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
  requestBodies:
    StayOccurrence:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StayOccurrenceRequest"
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
  headers:
    RequestId:
      description: Identificador sanitizado de correlação da requisição.
      schema:
        type: string
    NoStore:
      description: Impede armazenamento de respostas operacionais.
      schema:
        type: string
        const: no-store
    PublicCache:
      description: Cache curto somente para a release pública protegida.
      required: true
      schema:
        type: string
        const: "public, max-age=300, stale-if-error=86400"
    PublicEntityTag:
      description: ETag forte do JSON canônico da variante pública.
      required: true
      schema:
        type: string
        pattern: '^"sha256-[0-9a-f]{64}"$'
    EntityTag:
      description: ETag forte canônico correspondente ao version positivo.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: URI relativa do recurso criado.
      required: true
      schema:
        type: string
    IdempotencyReplayed:
      description: Informa se a resposta foi reconstruída de replay idempotente.
      required: true
      schema:
        type: string
        enum: ["true", "false"]
    RetryAfter:
      description: Segundos mínimos antes de nova tentativa.
      required: true
      schema:
        type: integer
        minimum: 1
    SurveyCapability:
      description: Header opcional, presente somente quando tourism_profile estiver publicado.
      schema:
        type: string
        minLength: 64
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
  responses:
    PublicNotModified:
      description: A variante pública não mudou.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/PublicCache"
        ETag:
          $ref: "#/components/headers/PublicEntityTag"
    Problem:
      description: Erro no formato Problem Details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerProblem:
      description: Erro interno sanitizado no formato Problem Details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemWithRetry:
      description: Conflito; Retry-After aparece somente quando houver processamento concorrente.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Presente somente para idempotency-in-progress.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimitedProblem:
      description: Limite de tentativas excedido.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StayCommandSucceeded:
      description: Comando aplicado ou reproduzido por replay idempotente.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StayMutationResult"
    AccommodationAccessRequestSucceeded:
      description: Decisão aplicada ou reproduzida por replay idempotente.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccommodationAccessRequest"
    QuestionnaireCreated:
      description: Questionário e primeira versão draft criados ou reproduzidos.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Location:
          $ref: "#/components/headers/Location"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuestionnaireVersionMutationResult"
    QuestionnaireVersionCreated:
      description: Nova versão draft clonada ou reproduzida.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Location:
          $ref: "#/components/headers/Location"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuestionnaireVersionMutationResult"
    QuestionnaireVersionSucceeded:
      description: Versão alterada, transicionada ou reproduzida.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuestionnaireVersionMutationResult"
    QuestionnaireVersionUpdated:
      description: Conteúdo draft substituído.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/EntityTag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuestionnaireVersionAdmin"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: >
            Segredo do operador. Nunca é registrado em log, métrica, trace ou
            evento de auditoria.
    PasswordRotationRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 12
          maxLength: 256
          description: >
            Senha em vigor. Nunca é registrada em log, métrica, trace ou evento
            de auditoria.
        new_password:
          type: string
          minLength: 12
          maxLength: 256
          description: >
            Nova senha; precisa diferir da atual. A política segue a orientação
            do NIST SP 800-63B de privilegiar comprimento sobre composição.
    Session:
      type: object
      required: [token, expires_at, account]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          description: >
            Token opaco para o header Authorization. Deve permanecer em memória
            e nunca em localStorage, sessionStorage ou cache.
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/SessionAccount"
    SessionAccount:
      type: object
      required: [id, email, display_name, scopes, must_change_password]
      additionalProperties: false
      properties:
        must_change_password:
          type: boolean
          description: >
            Verdadeiro enquanto a senha semeada não for trocada. Nesse estado a
            sessão só alcança troca de senha, logout e consulta da própria
            sessão; qualquer rota com escopo responde 401.
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
    HealthStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    ReadinessStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ready
    BuildInfo:
      type: object
      required: [version, revision, built_at]
      additionalProperties: false
      properties:
        version:
          type: string
        revision:
          type: string
        built_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
