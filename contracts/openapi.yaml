      properties:
        name:
          type: string
          description: JSON Pointer ou nome do campo inválido, sem o valor recebido.
        reason:
          type: string
          pattern: "^[a-z0-9-]+$"
    AccommodationStatus:
      type: string
      enum: [pending_review, active, suspended, closed]
    AccommodationCategory:
      type: string
      description: >
        Classificação operacional ampla. Não constitui parecer jurídico,
        regularidade, Cadastur verificado ou autorização FNRH.
      enum:
        - formal_lodging
        - seasonal_rental
        - family_hosting
        - camping
        - regularizing
        - other
        - unclassified
    AccommodationInputCategory:
      type: string
      description: >
        Categoria operacional aceita em novas entradas. Unclassified é reservado
        a leituras e processos internos, nunca a input do participante.
      enum:
        - formal_lodging
        - seasonal_rental
        - family_hosting
        - camping
        - regularizing
        - other
    CreateAccommodationRequest:
      type: object
      required: [name, category, capacity, client_submission_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationInputCategory"
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        client_submission_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
          description: UUIDv7 canônico gerado pelo cliente para repetição segura.
    Accommodation:
      type: object
      required:
        - id
        - organization_id
        - name
        - category
        - status
        - public_listing
        - version
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationCategory"
        status:
          $ref: "#/components/schemas/AccommodationStatus"
        cadastur_id:
          type: [string, "null"]
          maxLength: 100
          readOnly: true
          description: >
            Metadado opcional provisionado por fonte confiável. Sua presença não
            comprova elegibilidade, autorização, credencial ou integração FNRH.
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 10000
        public_area_code:
          type: [string, "null"]
          maxLength: 100
        public_listing:
          $ref: "#/components/schemas/AccommodationPublicListing"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccommodationPublicListing:
      type: object
      description: >
        Consentimento vivo de publicação na lista aberta, com o contato que ele
        autoriza. enabled falso é o estado inicial de toda hospedagem: estar
        cadastrada não publica contato. Publicada exige telefone, e consented_at
        guarda o instante do consentimento vigente — republicar o que já estava
        publicado não reescreve a data, e despublicar a elimina.
      required: [enabled, phone, whatsapp, website, consented_at]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        phone:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{9,14}$"
        whatsapp:
          type: boolean
        website:
          type: [string, "null"]
          format: uri
          maxLength: 180
        consented_at:
          type: [string, "null"]
          format: date-time
    PublicAccommodationDirectory:
      type: object
      required: [updated_at, count, entries]
      additionalProperties: false
      properties:
        updated_at:
          type: string
          format: date-time
          description: >
            Alteração mais recente entre as hospedagens publicadas, não o
            instante da consulta: dois pedidos iguais devolvem o mesmo documento.
        count:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PublicAccommodationEntry"
    PublicAccommodationEntry:
      type: object
      required: [id, name, category, capacity, area_code, phone, whatsapp, website]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationCategory"
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 10000
        area_code:
          type: [string, "null"]
          maxLength: 100
        phone:
          type: string
          description: E.164 sem separador, para virar link discável e link de WhatsApp.
          pattern: "^\\+[1-9][0-9]{9,14}$"
        whatsapp:
          type: boolean
          description: O número publicado atende por WhatsApp.
        website:
          type: [string, "null"]
          format: uri
          maxLength: 180
    AccommodationPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Accommodation"
        next_cursor:
          type: [string, "null"]
    UpdateAccommodationRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationInputCategory"
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 10000
        public_area_code:
          type: [string, "null"]
          maxLength: 100
        public_listing_enabled:
          type: boolean
          description: >
            Publica ou retira a hospedagem da lista aberta. Publicar sem
            telefone — nem no corpo, nem já gravado — é recusado com 409: a
            lista existe para o hóspede ligar.
        public_contact_phone:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{9,14}$"
        public_contact_whatsapp:
          type: boolean
        public_website_url:
          type: [string, "null"]
          format: uri
          maxLength: 180
    AccommodationAccessRequestApprovalState:
      type: string
      description: >
        expired é o pedido que ninguém leu dentro do prazo, e não uma decisão:
        não tem decisor nem motivo. Vale igualmente para o recurso e para o
        filtro da fila, de propósito — um estado que a listagem não sabe pedir
        vira registro que a tela não sabe explicar.
      enum: [pending, approved, rejected, expired]
    AccommodationAccessRequestRejectionReason:
      type: string
      description: >
        Lista fechada pelo mesmo motivo de RejectStayRequest: o motivo vai para
        trilha append-only e texto livre viraria dado pessoal permanente.
      enum:
        - duplicate_request
        - not_a_lodging
        - insufficient_information
        - abuse
    AccommodationAccessRequestContext:
      type: object
      required: [proof_of_work, privacy_notice_version]
      additionalProperties: false
      properties:
        proof_of_work:
          $ref: "#/components/schemas/ProofOfWorkChallenge"
        privacy_notice_version:
          type: string
          minLength: 1
          maxLength: 100
    CreateAccommodationAccessRequest:
      type: object
      required:
        - client_submission_id
        - accommodation_name
        - category
        - capacity
        - contact_name
        - contact_email
        - city_label
        - state_code
        - privacy_notice_version
        - proof_of_work
      additionalProperties: false
      properties:
        client_submission_id:
          type: string
          format: uuid
          pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
          description: UUIDv7 canônico gerado pelo cliente para repetição segura.
        accommodation_name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationInputCategory"
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        contact_name:
          type: string
          minLength: 1
          maxLength: 120
        contact_email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        contact_phone:
          type: [string, "null"]
          minLength: 1
          maxLength: 40
        city_label:
          type: string
          minLength: 1
          maxLength: 120
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        privacy_notice_version:
          type: string
          minLength: 1
          maxLength: 100
        proof_of_work:
          type: object
          required: [challenge, solution]
          additionalProperties: false
          properties:
            challenge:
              type: string
              minLength: 32
              maxLength: 256
              pattern: "^[A-Za-z0-9_-]+$"
            solution:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
    AccommodationAccessRequestCreated:
      description: >
        Recibo mínimo. Nenhum campo enviado é devolvido: a rota é aberta e o eco
        transformaria a criação em consulta de dado de contato alheio.
      type: object
      required: [id, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AccommodationAccessRequest:
      type: object
      required:
        - id
        - accommodation_name
        - category
        - capacity
        - contact_name
        - contact_email
        - contact_phone
        - city_label
        - state_code
        - approval_state
        - expires_at
        - accommodation_id
        - rejection_reason_code
        - version
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        accommodation_name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/AccommodationInputCategory"
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        contact_name:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          description: >
            Nulo depois de rejected ou expired: a ADR-042 elimina o dado pessoal
            do canal aberto e preserva só o fato, o motivo e o instante.
        contact_email:
          type: [string, "null"]
          format: email
          minLength: 3
          maxLength: 254
          description: >
            Nulo depois de rejected ou expired, pelo mesmo motivo de
            contact_name. Presente apenas em pending e approved.
        contact_phone:
          type: [string, "null"]
          minLength: 1
          maxLength: 40
          description: >
            Opcional no envio e nulo depois de rejected ou expired.
        city_label:
          type: string
          minLength: 1
          maxLength: 120
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        approval_state:
          $ref: "#/components/schemas/AccommodationAccessRequestApprovalState"
        expires_at:
          type: string
          format: date-time
          description: >
            Prazo do pedido pendente, para a fila mostrar quanto tempo resta.
            Vencido, o contato é eliminado e o estado vira expired.
        accommodation_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Acomodação criada na aprovação; nula nos demais estados.
        rejection_reason_code:
          oneOf:
            - $ref: "#/components/schemas/AccommodationAccessRequestRejectionReason"
            - type: "null"
          description: Preenchido somente quando approval_state é rejected.
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
