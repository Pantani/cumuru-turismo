title = "Cumuru secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "runtime.env.example carries only SUBSTITUIR-POR placeholders"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^deploy/runtime\.env\.example$''']
regexTarget = "match"
# The base64 prefix decodes to "SUBSTITUIR-POR-": a real key pasted into the
# template does not match it, so the scan still fails closed on the file.
regexes = ['''U1VCU1RJVFVJUi1QT1It[A-Za-z0-9+/=]*''']

[[allowlists]]
description = "Phase 7 poster token fixture is a repeated hex alphabet"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/api/internal/platform/httpapi/phase7_test\.go$''']
regexTarget = "match"
# Só o alfabeto hexadecimal repetido passa. Um token real colado no mesmo
# arquivo não tem essa forma, então o gate continua fechado ali.
regexes = ['''(?:0123456789abcdef){2,}[0-9a-f]*''']

[[allowlists]]
description = "Phase 7 fragment test uses a literal alphabet sample"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/api/internal/platform/store/phase7_repository_test\.go$''']
regexTarget = "match"
# O valor exato exercita a codificação do fragmento contra host.invalid.
regexes = ['''abcDEF-_0123456789''']

[[allowlists]]
description = "Generated API image SHA references are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^artifacts/sbom/api-image\.cdx\.json$''',
  '''^artifacts/sbom/image-manifest\.json$''',
]
regexTarget = "match"
regexes = ['''cumuru-api:[0-9a-f]{40}''']
