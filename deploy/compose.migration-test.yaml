name: cumuru-migration-test

services:
  postgres:
    # A suíte conversa pela rede Compose e não precisa competir por uma porta
    # publicada no host quando outra stack local já está ativa.
    ports: !reset []
  api:
    environment:
      TRUSTED_PROXY_CIDRS: 172.30.${CUMURU_SUBNET_OCTET:-1}.10/32
  web:
    networks:
      private:
        ipv4_address: 172.30.${CUMURU_SUBNET_OCTET:-1}.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.${CUMURU_SUBNET_OCTET:-1}.0/24
