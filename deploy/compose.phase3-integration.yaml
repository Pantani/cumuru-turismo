name: cumuru-phase3-integration

services:
  postgres:
    # O harness publica somente uma porta efêmera no loopback.
    ports: !override
      - "127.0.0.1::5432"
  api:
    environment:
      TRUSTED_PROXY_CIDRS: 172.30.3.10/32
      PHASE3_ENABLED: "true"
  web:
    networks:
      private:
        ipv4_address: 172.30.3.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.3.0/24
