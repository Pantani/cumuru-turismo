name: cumuru-analytics-integration

services:
  postgres:
    ports: !override
      []
  api:
    environment:
      ANALYTICS_ENABLED: "true"
      PUBLIC_DATABASE_URL: postgres://cumuru_public:cumuru-local-public-only@postgres:5432/cumuru?sslmode=disable
      TRUSTED_PROXY_CIDRS: 172.30.4.10/32
  worker:
    environment:
      ANALYTICS_ENABLED: "true"
      ANALYTICS_INCREMENTAL_INTERVAL: 500ms
  web:
    networks:
      private:
        ipv4_address: 172.30.4.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.4.0/24
