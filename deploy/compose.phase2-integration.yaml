name: cumuru-phase2-integration

services:
  postgres:
    # O harness descobre esta porta efêmera; nenhum banco compartilhado é usado.
    ports: !override
      - "127.0.0.1::5432"
  api:
    environment:
      TRUSTED_PROXY_CIDRS: 172.30.${CUMURU_SUBNET_OCTET:-2}.10/32
  web:
    networks:
      private:
        ipv4_address: 172.30.${CUMURU_SUBNET_OCTET:-2}.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.${CUMURU_SUBNET_OCTET:-2}.0/24
