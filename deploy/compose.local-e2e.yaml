services:
  api:
    environment:
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${LOCAL_E2E_PORT:?LOCAL_E2E_PORT is required}
      TRUSTED_PROXY_CIDRS: 172.30.${LOCAL_E2E_SUBNET_OCTET:?LOCAL_E2E_SUBNET_OCTET is required}.10/32

  web:
    ports: !override
      - "127.0.0.1:${LOCAL_E2E_PORT:?LOCAL_E2E_PORT is required}:8080"
    networks:
      private:
        ipv4_address: 172.30.${LOCAL_E2E_SUBNET_OCTET:?LOCAL_E2E_SUBNET_OCTET is required}.10

networks:
  private:
    ipam:
      config: !override
        # Octeto escolhido em tempo de execução pelo script, entre os livres da
        # faixa reservada. Um subnet fixo torna duas execuções próximas
        # incompatíveis: a segunda pede o mesmo endereço enquanto a rede órfã da
        # primeira ainda está sendo removida, e o daemon recusa com
        # "Pool overlaps with other one on this address space" — vermelho que
        # não é falha de teste, e que já custou duas investigações.
        - subnet: 172.30.${LOCAL_E2E_SUBNET_OCTET:?LOCAL_E2E_SUBNET_OCTET is required}.0/24
