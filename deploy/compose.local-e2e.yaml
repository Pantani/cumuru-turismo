services:
  api:
    environment:
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${LOCAL_E2E_PORT:?LOCAL_E2E_PORT is required}
      TRUSTED_PROXY_CIDRS: 172.30.6.10/32

  web:
    ports: !override
      - "127.0.0.1:${LOCAL_E2E_PORT:?LOCAL_E2E_PORT is required}:8080"
    networks:
      private:
        ipv4_address: 172.30.6.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.6.0/24
