name: cumuru-phase2-full-stack

services:
  postgres:
    ports: !reset []
  api:
    environment:
      TRUSTED_PROXY_CIDRS: 172.30.3.10/32
  web:
    ports: !override
      - "127.0.0.1::8080"
    networks:
      private:
        ipv4_address: 172.30.3.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.3.0/24
