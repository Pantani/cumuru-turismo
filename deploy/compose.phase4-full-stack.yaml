name: cumuru-phase4-full-stack

services:
  postgres:
    ports: !override
      []
  api:
    environment:
      PHASE4_ENABLED: "true"
      PUBLIC_DATABASE_URL: postgres://cumuru_public:cumuru-local-public-only@postgres:5432/cumuru?sslmode=disable
      TRUSTED_PROXY_CIDRS: 172.30.5.10/32
  worker:
    environment:
      PHASE4_ENABLED: "true"
      PHASE4_INCREMENTAL_INTERVAL: 500ms
  web:
    ports: !override
      []
    networks:
      private:
        ipv4_address: 172.30.5.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.5.0/24
