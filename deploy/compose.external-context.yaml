name: cumuru-external-context

# Stack do gate de isolamento da camada externa (ADR-045). A camada nasce
# desligada aqui: a fase A do teste mede as quatro rotas protegidas sem ela, e é
# contra essa medida que a fase B compara corpo e ETag.
services:
  postgres:
    ports: !override
      []
  api:
    environment:
      ANALYTICS_ENABLED: "true"
      PUBLIC_DATABASE_URL: postgres://cumuru_public:cumuru-local-public-only@postgres:5432/cumuru?sslmode=disable
      TRUSTED_PROXY_CIDRS: 172.30.${CUMURU_SUBNET_OCTET:-8}.10/32
  worker:
    environment:
      ANALYTICS_ENABLED: "true"
      ANALYTICS_INCREMENTAL_INTERVAL: 500ms
  web:
    ports: !override
      []
    networks:
      private:
        ipv4_address: 172.30.${CUMURU_SUBNET_OCTET:-8}.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.${CUMURU_SUBNET_OCTET:-8}.0/24
