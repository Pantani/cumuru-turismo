name: cumuru-phase7-integration

services:
  postgres:
    # O harness descobre esta porta efêmera; nenhum banco compartilhado é usado.
    # A suíte Go da fase precisa alcançar o banco a partir do host, o que o
    # overlay de migration-test não permite porque zera as portas publicadas.
    ports: !override
      - "127.0.0.1::5432"
  api:
    environment:
      TRUSTED_PROXY_CIDRS: 172.30.7.10/32
  web:
    networks:
      private:
        ipv4_address: 172.30.7.10

networks:
  private:
    ipam:
      config: !override
        - subnet: 172.30.7.0/24
