services:
  local-demo:
    image: "cumuru-api:${CUMURU_IMAGE_TAG:-0.2.0}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_VERSION: "${CUMURU_BUILD_VERSION:?build metadata wrapper is required}"
        BUILD_REVISION: "${CUMURU_BUILD_REVISION:?build metadata wrapper is required}"
        BUILD_TIME: "${CUMURU_BUILD_TIME:?build metadata wrapper is required}"
    command: ["/app/local-demo"]
    environment: &local-demo-environment
      APP_ENV: local
      OIDC_MODE: fake
      OIDC_ISSUER: https://oidc.invalid/local
      OIDC_AUDIENCE: cumuru-local
      OTEL_EXPORTER: none
      LOCAL_DEMO_ENABLED: "true"
      LOCAL_DEMO_ACCOUNT_PASSWORD: "${LOCAL_DEMO_ACCOUNT_PASSWORD:-demonstracao-local-2026}"
      DATABASE_URL: postgres://cumuru_app:cumuru-local-app-only@postgres:5432/cumuru?sslmode=disable
      WORKER_DATABASE_URL: postgres://cumuru_worker:cumuru-local-worker-only@postgres:5432/cumuru?sslmode=disable
      PROVISIONING_DATABASE_URL: postgres://cumuru_migration:cumuru-local-migration-only@postgres:5432/cumuru?sslmode=disable
      INVITE_BASE_URL: http://127.0.0.1:4173/convites
      INVITE_TTL: 72h
      IDEMPOTENCY_TTL: 87600h
      RATE_LIMIT_WINDOW: 1m
      INVITE_CONTEXT_RATE_LIMIT: "30"
      INVITE_SUBMIT_RATE_LIMIT: "10"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:5173
      INVITE_HMAC_CURRENT_VERSION: local-v1
      INVITE_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtaW52aXRlLWtleS12MS0wMDA=
      ACTOR_HMAC_CURRENT_VERSION: local-v1
      ACTOR_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtYWN0b3Ita2V5LXYxLTAwMDA=
      IDEMPOTENCY_HMAC_CURRENT_VERSION: local-v1
      IDEMPOTENCY_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtaWRlbXBvdGVuY3ktdjEtMDA=
      RATE_LIMIT_HMAC_CURRENT_VERSION: local-v1
      RATE_LIMIT_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtcmF0ZS1saW1pdC12MS0wMDA=
      CURSOR_HMAC_CURRENT_VERSION: local-v1
      CURSOR_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtY3Vyc29yLWtleS12MS0wMDA=
      DOCUMENT_HMAC_CURRENT_VERSION: local-v1
      DOCUMENT_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtZG9jdW1lbnQtdjEtMDA=
      PHASE3_ENABLED: "true"
      SURVEY_CAPABILITY_TTL: 24h
      SURVEY_FREE_TEXT_TTL: 24h
      SURVEY_SUBMIT_RATE_LIMIT: "10"
      SURVEY_FREE_TEXT_CLEANUP_ENABLED: "true"
      SURVEY_HMAC_CURRENT_VERSION: local-v1
      SURVEY_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3Qtc3VydmV5LWhtYWMtdjEtMDAw
      SURVEY_FREE_TEXT_CURRENT_VERSION: local-v1
      SURVEY_FREE_TEXT_KEYS: local-v1=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PHASE4_ENABLED: "true"
      PUBLIC_DATABASE_TIMEOUT: 3s
      PHASE4_PRIMARY_CELL_THRESHOLD: "10"
      PHASE4_MINIMUM_REPORTING_ACCOMMODATIONS: "3"
      PHASE4_ROUNDING_BASE: "10"
      PHASE4_PRE_REGISTERED_WEIGHT: "0.80"
      PHASE4_INCREMENTAL_INTERVAL: 15m
      PHASE4_FULL_RECONCILIATION_INTERVAL: 24h
      # Fase 7: autoatendimento e aprovação. Sem esta habilitação as rotas do canal
      # aberto não são registradas, e qualquer gate que sonde /accommodation-invite
      # ou /activation fica verde por ausência de rota em vez de por comportamento.
      PHASE7_ENABLED: "true"
      # Keyring próprio: o loader recusa sobreposição com qualquer outro ring, porque
      # uma chave vazada permitiria forjar token de convite ou digest de idempotência.
      PROOF_OF_WORK_HMAC_CURRENT_VERSION: local-v1
      PROOF_OF_WORK_HMAC_KEYS: local-v1=Y3VtdXJ1LWxvY2FsLXRlc3QtcHJvb2Ytb2Ytd29yay0x
      PROOF_OF_WORK_TTL: 10m
      PROOF_OF_WORK_DIFFICULTY_BASE: "12"
      PROOF_OF_WORK_DIFFICULTY_CEILING: "18"
      PROOF_OF_WORK_REQUESTS_PER_BIT: "2"
      SELF_SERVICE_CONTEXT_RATE_LIMIT: "60"
      SELF_SERVICE_SUBMIT_RATE_LIMIT: "20"
      ACTIVATION_CONTEXT_RATE_LIMIT: "30"
      ACTIVATION_SUBMIT_RATE_LIMIT: "10"
      APPROVAL_EXPIRY_BATCH_SIZE: "200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    networks: [private]

  # Semeadura de bootstrap sob demanda: `make seed`. Fica fora do perfil padrão
  # porque `make up` já aplica as fixtures pelo local-demo; este serviço existe
  # para exercitar localmente o mesmo binário que staging e produção executam.
  seed:
    profiles: [seed]
    image: "cumuru-api:${CUMURU_IMAGE_TAG:-0.2.0}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_VERSION: "${CUMURU_BUILD_VERSION:?build metadata wrapper is required}"
        BUILD_REVISION: "${CUMURU_BUILD_REVISION:?build metadata wrapper is required}"
        BUILD_TIME: "${CUMURU_BUILD_TIME:?build metadata wrapper is required}"
    command: ["/app/seed"]
    environment:
      <<: *local-demo-environment
      SEED_ENABLED: "true"
      SEED_PROFILE: "${SEED_PROFILE:-admin}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}"
      SEED_ADMIN_DISPLAY_NAME: "${SEED_ADMIN_DISPLAY_NAME:-Administração Cumuru}"
      SEED_ADMIN_MUST_CHANGE_PASSWORD: "${SEED_ADMIN_MUST_CHANGE_PASSWORD:-false}"
      # Caminho dentro do container: o catálogo é montado abaixo, então o valor
      # de host presente no .env não vale aqui.
      SEED_ACCOMMODATION_CATALOG: "/seeds/${SEED_LOCAL_CATALOG:-accommodations.example.json}"
    volumes:
      - ./seeds:/seeds:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    networks: [private]

  api:
    environment:
      ACCOMMODATION_ONBOARDING_ENABLED: "true"
    depends_on:
      local-demo:
        condition: service_completed_successfully

  worker:
    depends_on:
      local-demo:
        condition: service_completed_successfully

  web:
    build:
      args:
        LOCAL_DEMO_PROXY_LOOPBACK: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:8080/api/v1/public/summary >/dev/null
      interval: 2s
      timeout: 3s
      retries: 60
