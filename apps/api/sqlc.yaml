version: "2"
sql:
  - engine: postgresql
    schema: ../../database/schema.sql
    queries: internal/platform/store/queries
    gen:
      go:
        package: generated
        out: internal/platform/store/generated
        sql_package: pgx/v5
        emit_db_tags: false
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
