name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUMURU_IMAGE_TAG: ${{ github.sha }}
      CUMURU_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache-dependency-path: apps/api/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install pinned ripgrep
        env:
          RIPGREP_VERSION: 15.2.0
          RIPGREP_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          archive="${RUNNER_TEMP}/ripgrep.tar.gz"
          extracted="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --location --silent --show-error \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          echo "${RIPGREP_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${extracted}/rg" "${RUNNER_TEMP}/rg"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/rg" --version

      - name: Install locked dependencies
        run: make install

      - name: Install pinned Go quality tools
        run: make tools

      - name: Install Chromium for the canonical browser gate
        run: npm exec -- playwright install --with-deps chromium

      - name: Run explicit post-task quality gate
        run: |
          make post-task-quality

      - name: Run canonical CI gate
        run: make ci

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: |
            artifacts/sbom/*.json
          if-no-files-found: error
          retention-days: 14
